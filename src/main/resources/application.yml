spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ekayn}
    username: ${DATABASE_USERNAME:ekayn}
    password: ${DATABASE_PASSWORD:ekayn}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  jackson.serialization.write-dates-as-timestamps: false
server.port: ${PORT:8080}
app:
  jwt-secret: ${JWT_SECRET:}
  frontend-urls: ${FRONTEND_URLS:http://localhost:4321,http://localhost:4322,https://ekayn.com,https://www.ekayn.com}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:no-reply@ekayn.com}
  cookie-secure: ${COOKIE_SECURE:false}
  cookie-domain: ${COOKIE_DOMAIN:}
stripe.api-key: ${STRIPE_SECRET_KEY:}
stripe.webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false
