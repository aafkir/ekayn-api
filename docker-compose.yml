services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ekayn
      POSTGRES_USER: ekayn
      POSTGRES_PASSWORD: ekayn
    ports: ["5432:5432"]
    volumes: ["ekayn-postgres:/var/lib/postgresql/data"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  ekayn-postgres:
